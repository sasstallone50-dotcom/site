<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1c1e21;
            --text-secondary: #65676b;
            --btn-bg: #007bff;
            --btn-hover: #0056b3;
            --shadow: rgba(0, 0, 0, 0.1);
            --link-card-bg: #f8f9fa;
            --link-card-hover: #e9ecef;
            --tg-color: #229ED9;
            --ig-color: #E1306C;
        }

        body.dark-mode {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-main: #e4e6eb;
            --text-secondary: #b0b3b8;
            --btn-bg: #2d88ff;
            --btn-hover: #1b74e4;
            --shadow: rgba(0, 0, 0, 0.4);
            --link-card-bg: #3a3b3c;
            --link-card-hover: #4e4f50;
            --tg-color: #38b3ec;
            --ig-color: #f7528b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--text-secondary);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .profile-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 8px 30px var(--shadow);
            text-align: center;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            margin-top: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            object-position: top;
            border: 3px solid var(--btn-bg);
            margin-bottom: 16px;
            box-shadow: 0 4px 12px var(--shadow);
            background-color: #e9ecef;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .bio {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 18px;
            background-color: var(--link-card-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px var(--shadow);
        }

        .link-item svg {
            flex-shrink: 0;
        }

        .link-item:hover {
            background-color: var(--link-card-hover);
            transform: translateY(-2px);
        }

        .link-tg-channel {
            background-color: var(--tg-color);
            color: #ffffff !important;
        }

        .link-tg-channel svg {
            fill: #ffffff;
        }

        .link-tg-channel:hover {
            opacity: 0.9;
        }

        .link-tg svg {
            fill: var(--tg-color);
        }

        .link-ig svg {
            fill: var(--ig-color);
        }

        .link-email {
            background-color: var(--btn-bg);
            color: #ffffff !important;
        }

        .link-email svg {
            fill: #ffffff;
        }

        .link-email:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeBtn.textContent = '☀️ Светлая тема';
        }

        themeBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                themeBtn.textContent = '☀️ Светлая тема';
                localStorage.setItem('theme', 'dark');
            } else {
                themeBtn.textContent = '🌙 Тёмная тема';
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
